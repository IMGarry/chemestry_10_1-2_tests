  #score-box.shown{ display:block; }

  .answer-key .card{ background:#fbfcfe; }
  .answer-key .key-item{ margin-bottom:10px; }

// ============================================================
// УТИЛИТЫ
// ============================================================
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const root = document.getElementById('quiz-root');
const nav = document.createElement('nav');
nav.className = 'sections';
root.parentNode.insertBefore(nav, root);

let qCounter = 0;
let totalQ = 0;
MC_SECTIONS.forEach(s => { totalQ += (s.questions?s.questions.length:0) + (s.svgQuestions?s.svgQuestions.length:0); });
totalQ += ORDER_QUESTIONS.length + MATCH_QUESTIONS.length;
document.getElementById('progress').textContent = 'Всего заданий: ' + totalQ + ' (при новой попытке вопросы и варианты перемешиваются)';

function renderMCQuestion(item, card){
  qCounter++;
  const qId = 'q'+qCounter;
  const qDiv = document.createElement('div');
  qDiv.className = 'q';
  qDiv.dataset.type = 'mc';
  qDiv.dataset.qid = qId;

  const p = document.createElement('div');
  p.className = 'prompt';
  p.textContent = qCounter + '. ' + item.q;
  qDiv.appendChild(p);

  if (item.svg && SVG[item.svg]) {
    const imgWrap = document.createElement('div');
    imgWrap.className = 'qimg';
    imgWrap.innerHTML = SVG[item.svg];
    qDiv.appendChild(imgWrap);
  }

  const correctText = item.opts[item.correct];
  const shuffledOpts = shuffle(item.opts);
  qDiv.dataset.correctText = correctText;

  const optsDiv = document.createElement('div');
  optsDiv.className = 'options';
  shuffledOpts.forEach((optText) => {
    const label = document.createElement('label');
    label.innerHTML = '<input type="radio" name="'+qId+'" value="'+encodeURIComponent(optText)+'"> ' + optText;
    optsDiv.appendChild(label);
  });
  qDiv.appendChild(optsDiv);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.dataset.base = item.exp;
  fb.innerHTML = item.exp;
  qDiv.appendChild(fb);

  card.appendChild(qDiv);
}

MC_SECTIONS.forEach((sec, sIdx) => {
  const navBtn = document.createElement('button');
  navBtn.textContent = sec.section.replace(/^\d+\.\s*/, '');
  navBtn.onclick = () => { document.getElementById('sec-'+sIdx).scrollIntoView({behavior:'smooth', block:'start'}); };
  nav.appendChild(navBtn);

  const title = document.createElement('div');
  title.className = 'section-title';
  title.id = 'sec-'+sIdx;
  title.textContent = sec.section;
  root.appendChild(title);

  const card = document.createElement('div');
  card.className = 'card';

  const allQ = [...(sec.svgQuestions||[]), ...(sec.questions||[])];
  shuffle(allQ).forEach(item => renderMCQuestion(item, card));

  root.appendChild(card);
});

// ---- Последовательности ----
const orderTitle = document.createElement('div');
orderTitle.className = 'section-title';
orderTitle.id = 'sec-order';
orderTitle.textContent = '14. Последовательности';
root.appendChild(orderTitle);
const orderSub = document.createElement('div');
orderSub.className = 'section-sub';
orderSub.textContent = 'Присвойте каждому пункту номер по порядку (1 — начало цепочки).';
root.appendChild(orderSub);
const navOrderBtn = document.createElement('button');
navOrderBtn.textContent = 'Последовательности';
navOrderBtn.onclick = () => document.getElementById('sec-order').scrollIntoView({behavior:'smooth', block:'start'});
nav.appendChild(navOrderBtn);

const orderCard = document.createElement('div');
orderCard.className = 'card';
shuffle(ORDER_QUESTIONS).forEach((oq) => {
  qCounter++;
  const qDiv = document.createElement('div');
  qDiv.className = 'q';
  qDiv.dataset.type = 'order';
  const p = document.createElement('div');
  p.className = 'prompt';
  p.textContent = qCounter + '. ' + oq.q;
  qDiv.appendChild(p);

  const n = oq.items.length;
  const displayOrder = shuffle(oq.items.map((text, correctRank) => ({text, correctRank})));
  const ul = document.createElement('ul');
  ul.className = 'order-list';
  displayOrder.forEach((obj) => {
    const li = document.createElement('li');
    li.dataset.correctRank = obj.correctRank;
    let selectHtml = '<select>';
    for (let i=1;i<=n;i++) selectHtml += '<option value="'+i+'">'+i+'</option>';
    selectHtml += '</select>';
    li.innerHTML = selectHtml + '<span>'+obj.text+'</span>';
    ul.appendChild(li);
  });
  qDiv.appendChild(ul);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.dataset.base = oq.exp;
  fb.innerHTML = oq.exp;
  qDiv.appendChild(fb);

  orderCard.appendChild(qDiv);
});
root.appendChild(orderCard);

// ---- Сопоставление ----
const matchTitle = document.createElement('div');
matchTitle.className = 'section-title';
matchTitle.id = 'sec-match';
matchTitle.textContent = '15. Сопоставление';
root.appendChild(matchTitle);
const matchSub = document.createElement('div');
matchSub.className = 'section-sub';
matchSub.textContent = 'Для каждого понятия слева выберите пару из списка справа.';
root.appendChild(matchSub);
const navMatchBtn = document.createElement('button');
navMatchBtn.textContent = 'Сопоставление';
navMatchBtn.onclick = () => document.getElementById('sec-match').scrollIntoView({behavior:'smooth', block:'start'});
nav.appendChild(navMatchBtn);

const matchCard = document.createElement('div');
matchCard.className = 'card';
MATCH_QUESTIONS.forEach((mq) => {
  qCounter++;
  const qDiv = document.createElement('div');
  qDiv.className = 'q';
  qDiv.dataset.type = 'match';
  const p = document.createElement('div');
  p.className = 'prompt';
  p.textContent = qCounter + '. ' + mq.q;
  qDiv.appendChild(p);

  const rightOptions = shuffle(mq.pairs.map(pr => pr[1]));
  const shuffledLeft = shuffle(mq.pairs);
  shuffledLeft.forEach(([left, correctRight]) => {
    const row = document.createElement('div');
    row.className = 'match-row';
    row.dataset.correct = correctRight;
    const leftDiv = document.createElement('div');
    leftDiv.className = 'left';
    leftDiv.textContent = left;
    row.appendChild(leftDiv);
    const sel = document.createElement('select');
    const emptyOpt = document.createElement('option');
    emptyOpt.value=''; emptyOpt.textContent = '— выберите —';
    sel.appendChild(emptyOpt);
    rightOptions.forEach(rt => {
      const o = document.createElement('option');
      o.value = rt; o.textContent = rt;
      sel.appendChild(o);
    });
    row.appendChild(sel);
    qDiv.appendChild(row);
  });
  matchCard.appendChild(qDiv);
});
root.appendChild(matchCard);

// ПРОВЕРКА
// ============================================================
function checkAll(){
  let correctCount = 0, totalCount = 0, answeredCount = 0;

  document.querySelectorAll('.q[data-type="mc"]').forEach(qDiv => {
    totalCount++;
    const qid = qDiv.dataset.qid;
    const correctText = qDiv.dataset.correctText;
    const selected = qDiv.querySelector('input[name="'+qid+'"]:checked');
    const labels = qDiv.querySelectorAll('.options label');
    labels.forEach(l => l.classList.remove('opt-correct','opt-wrong'));
    const fb = qDiv.querySelector('.feedback');
    if (!selected){ fb.classList.remove('shown'); return; }
    answeredCount++;
    const selText = decodeURIComponent(selected.value);
    labels.forEach(l => {
      const inp = l.querySelector('input');
      if (decodeURIComponent(inp.value) === correctText) l.classList.add('opt-correct');
    });
    if (selText === correctText){
      correctCount++;
      fb.className = 'feedback correct shown';
      fb.innerHTML = '✔ Верно! ' + fb.dataset.base;
    } else {
      labels.forEach(l => { if(l.querySelector('input')===selected) l.classList.add('opt-wrong'); });
      fb.className = 'feedback wrong shown';
      fb.innerHTML = '✘ Неверно. ' + fb.dataset.base;
    }
  });

  document.querySelectorAll('.q[data-type="order"]').forEach(qDiv => {
    totalCount++;
    const items = qDiv.querySelectorAll('.order-list li');
    let allFilled = true, allCorrect = true;
    items.forEach(li => {
      const sel = li.querySelector('select');
      li.classList.remove('ord-correct','ord-wrong');
      if (!sel.value) { allFilled = false; return; }
      const chosenRank = parseInt(sel.value,10) - 1;
      const correctRank = parseInt(li.dataset.correctRank,10);
      if (chosenRank === correctRank) { li.classList.add('ord-correct'); }
      else { li.classList.add('ord-wrong'); allCorrect = false; }
    });
    const fb = qDiv.querySelector('.feedback');
    if (!allFilled){ fb.classList.remove('shown'); return; }
    answeredCount++;
    if (allCorrect){ correctCount++; fb.className='feedback correct shown'; fb.innerHTML = '✔ Верно! ' + fb.dataset.base; }
    else { fb.className='feedback wrong shown'; fb.innerHTML = '✘ Есть ошибки в порядке. ' + fb.dataset.base; }
  });

  document.querySelectorAll('.q[data-type="match"]').forEach(qDiv => {
    totalCount++;
    const rows = qDiv.querySelectorAll('.match-row');
    let allFilled = true, allCorrect = true;
    rows.forEach(row => {
      const sel = row.querySelector('select');
      row.classList.remove('m-correct','m-wrong');
      if (!sel.value) { allFilled = false; return; }
      if (sel.value === row.dataset.correct) { row.classList.add('m-correct'); }
      else { row.classList.add('m-wrong'); allCorrect = false; }
    });
    if (!allFilled) return;
    answeredCount++;
    if (allCorrect) correctCount++;
  });

  const scoreBox = document.getElementById('score-box');
  scoreBox.className = 'shown';
  scoreBox.innerHTML = 'Отвечено на ' + answeredCount + ' из ' + totalCount + ' заданий.<br>Правильно: ' +
    correctCount + ' из ' + answeredCount + (answeredCount ? ' (' + Math.round(100*correctCount/answeredCount) + '%)' : '');
  scoreBox.scrollIntoView({behavior:'smooth', block:'center'});
}

function buildAnswerKey(){
  const keyRoot = document.getElementById('answer-key');
  let html = '<div class="section-title">📖 Ключ ответов</div><div class="card">';
  let n = 0;
  MC_SECTIONS.forEach(sec => {
    html += '<p><b>'+sec.section+'</b></p>';
    [...(sec.svgQuestions||[]), ...(sec.questions||[])].forEach(item => {
      n++;
      html += '<div class="key-item">'+n+'. '+item.q+'<br><b>Ответ: '+item.opts[item.correct]+'</b><br><span style="color:#667">'+item.exp+'</span></div>';
    });
  });
  html += '<p><b>Последовательности</b></p>';
  ORDER_QUESTIONS.forEach(oq => {
    n++;
    html += '<div class="key-item">'+n+'. '+oq.q+'<br><b>Порядок: '+oq.items.join(' → ')+'</b><br><span style="color:#667">'+oq.exp+'</span></div>';
  });
  html += '<p><b>Сопоставление</b></p>';
  MATCH_QUESTIONS.forEach(mq => {
    n++;
    const pairsText = mq.pairs.map(p => p[0]+' → '+p[1]).join('; ');
    html += '<div class="key-item">'+n+'. '+mq.q+'<br><b>'+pairsText+'</b></div>';
  });
  html += '</div>';
  keyRoot.innerHTML = html;
}
buildAnswerKey();

function toggleKey(){
  const el = document.getElementById('answer-key');
  el.classList.toggle('shown');
  if (el.classList.contains('shown')) el.scrollIntoView({behavior:'smooth', block:'start'});
}
